# Builds a release whenever a version tag is pushed, e.g.:
#   git tag v1.0.0
#   git push origin v1.0.0
# The release gets a zip of the program (ready to run with `python iot.py`) and notes listing the
# changes since the previous release.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # needed to create the release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Get the tagged code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check every file parses
        run: |
          python -c "import ast, glob; [ast.parse(open(f, encoding='utf-8').read(), f) for f in ['iot.py'] + glob.glob('scripts/*.py')]"

      - name: Package
        run: |
          name="IOT-${GITHUB_REF_NAME}"
          mkdir -p "dist/${name}"
          cp -r iot.py scripts docs README.md LICENSE "dist/${name}/"
          cd dist && zip -r -q "${name}.zip" "${name}"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "dist/IOT-${GITHUB_REF_NAME}.zip" \
            --title "I.O.T ${GITHUB_REF_NAME}" \
            --generate-notes
